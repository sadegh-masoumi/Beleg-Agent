name: Evals

# Runs a small eval subset against Gemini when extraction code, the prompt or the eval harness changes.
# Fails the build if key-field accuracy drops below the threshold.
# Needs the repository secret GEMINI_API_KEY; without it the job is skipped with a notice.
# Uses only the public ZUGFeRD corpus (free tier is acceptable for public data).

on:
  workflow_dispatch:
    inputs:
      max_docs:
        description: Number of documents
        default: "10"
  push:
    branches: [main]
    paths:
      - "beleg-core/**"
      - "beleg-extraction/**"
      - "beleg-evals/**"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals
  cancel-in-progress: true

env:
  # Pinned so results are comparable over time; update deliberately together with docs/evals/results.md.
  CORPUS_COMMIT: 02d4b5684738cb2d9faac2cec6599dc0e86c16d5
  MIN_KEY_ACCURACY: "0.9"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Skip without API key
        if: env.GEMINI_API_KEY == ''
        run: echo "::notice::GEMINI_API_KEY secret is not set; skipping evals"

      - uses: actions/checkout@v4
        if: env.GEMINI_API_KEY != ''

      - uses: actions/setup-java@v4
        if: env.GEMINI_API_KEY != ''
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Fetch ZUGFeRD corpus
        if: env.GEMINI_API_KEY != ''
        run: |
          git clone --quiet https://github.com/ZUGFeRD/corpus.git data/zugferd-corpus
          git -C data/zugferd-corpus checkout --quiet "$CORPUS_COMMIT"

      - name: Run evals
        if: env.GEMINI_API_KEY != ''
        run: |
          mvn -B -ntp -q -pl beleg-evals -am package -DskipTests
          java -jar beleg-evals/target/beleg-evals.jar \
            --max-docs "${{ github.event.inputs.max_docs || '10' }}" \
            --configs lite35-medium \
            --delay-ms 4000 \
            --min-key-accuracy "$MIN_KEY_ACCURACY"

      - name: Upload report
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-results/*/report.md
          if-no-files-found: ignore
