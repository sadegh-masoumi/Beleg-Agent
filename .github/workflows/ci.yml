name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers uses the runner's Docker daemon.
      - name: Build and test
        run: mvn -B -ntp verify
      # Model evals run in evals.yml (needs the GEMINI_API_KEY secret).
